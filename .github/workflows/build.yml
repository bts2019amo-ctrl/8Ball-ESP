name: Build 8Ball Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip full source
        run: |
          set -x
          ls -la
          if [ -f 8Ball-2.zip ]; then
            rm -rf 8Ball
            unzip -o 8Ball-2.zip
            echo "=== extracted ==="
            ls -la 8Ball/
          fi

      - name: Install tools
        run: |
          set -x
          brew install ldid
          xcode-select -p
          clang --version || true

      - name: Setup Theos
        run: |
          set -x
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          cd "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git sdks || true
          ls -la "$THEOS"
          ls /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ 2>/dev/null || true

      - name: Build
        run: |
          set -x
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          cd 8Ball
          ls -la
          cat Makefile
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless || make package

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find 8Ball -name "*.deb" -exec cp {} out/ \; || true
          find 8Ball -name "*.dylib" -exec cp {} out/ \; || true
          ls -la out/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8Ball-deb
          path: out/
          if-no-files-found: warn
