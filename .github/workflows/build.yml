name: Build 8Ball Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip full source
        run: |
          if [ -f 8Ball-2.zip ]; then
            rm -rf 8Ball
            unzip -o 8Ball-2.zip
            ls -la 8Ball/
          fi

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          cache: true

      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -x
          export PATH="$THEOS/bin:$PATH"
          ls -la "$THEOS/sdks" || true
          cd 8Ball
          # kill the imgui clang warning that is treated as error
          export ADDITIONAL_CFLAGS="-Wno-uninitialized-const-pointer -Wno-error=uninitialized-const-pointer -Wno-error"
          export ADDITIONAL_CCFLAGS="-Wno-uninitialized-const-pointer -Wno-error=uninitialized-const-pointer -Wno-error"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless \
            8Ball_CFLAGS+="-Wno-uninitialized-const-pointer -Wno-error" \
            8Ball_CCFLAGS+="-Wno-uninitialized-const-pointer -Wno-error" \
            2>&1 | tee /tmp/build.log
          echo "=== exit $? ==="
          tail -50 /tmp/build.log
          find . -name "*.deb" -o -name "*.dylib" | head -30

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find 8Ball -name "*.deb" -exec cp -v {} out/ \; 2>/dev/null || true
          find 8Ball -name "*.dylib" -exec cp -v {} out/ \; 2>/dev/null || true
          find 8Ball/.theos -name "*.dylib" -exec cp -v {} out/ \; 2>/dev/null || true
          ls -laR out/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8Ball-deb
          path: out/
          if-no-files-found: warn
