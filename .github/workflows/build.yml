name: Build 8Ball Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip full source
        run: |
          if [ -f 8Ball-2.zip ]; then
            rm -rf 8Ball
            unzip -o 8Ball-2.zip
            ls -la 8Ball/
          fi

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          cache: true

      - name: Patch source for ARC
        run: |
          set -x
          # fix __weak under non-ARC / mixed
          sed -i '' 's/static __weak UIWindow/static __unsafe_unretained UIWindow/g' 8Ball/ImGuiDrawView.mm || \
          sed -i 's/static __weak UIWindow/static __unsafe_unretained UIWindow/g' 8Ball/ImGuiDrawView.mm
          grep -n "g_gestureAttachedWindow" 8Ball/ImGuiDrawView.mm | head -5

      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -x
          export PATH="$THEOS/bin:$PATH"
          cd 8Ball
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless \
            8Ball_CFLAGS+="-fobjc-arc -Wno-uninitialized-const-pointer -Wno-error -Wno-deprecated-declarations" \
            8Ball_CCFLAGS+="-std=c++17 -fobjc-arc -Wno-uninitialized-const-pointer -Wno-error -Wno-deprecated-declarations" \
            2>&1 | tee /tmp/build.log
          echo "MAKE_EXIT=${PIPESTATUS[0]}"
          tail -40 /tmp/build.log
          find . -name "*.deb" -o -name "*.dylib" | head -20

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find 8Ball -name "*.deb" -exec cp -v {} out/ \; 2>/dev/null || true
          find 8Ball -name "*.dylib" -exec cp -v {} out/ \; 2>/dev/null || true
          find 8Ball/.theos -name "*.dylib" -exec cp -v {} out/ \; 2>/dev/null || true
          ls -laR out/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8Ball-deb
          path: out/
          if-no-files-found: warn
