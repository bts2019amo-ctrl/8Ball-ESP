name: Build 8Ball Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip full source
        run: |
          set -x
          if [ -f 8Ball-2.zip ]; then
            rm -rf 8Ball
            unzip -o 8Ball-2.zip
            ls -la 8Ball/
          fi

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          cache: true

      - name: Ensure iPhoneOS SDK present
        run: |
          set -x
          echo "THEOS=$THEOS"
          ls -la $THEOS/sdks/ || true
          if ! ls $THEOS/sdks/iPhoneOS*.sdk >/dev/null 2>&1; then
            mkdir -p $THEOS/sdks
            curl -L -o /tmp/sdk.tar.xz "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz"
            tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks
            ls -la $THEOS/sdks/
          fi

      - name: Build
        run: |
          set -x
          export PATH="$THEOS/bin:$PATH"
          cd 8Ball
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee /tmp/build.log
          echo "=== make exit: $? ==="
          tail -100 /tmp/build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find 8Ball -name "*.deb" -exec cp -v {} out/ \; 2>/dev/null || true
          find 8Ball -name "*.dylib" -exec cp -v {} out/ \; 2>/dev/null || true
          find 8Ball/.theos -name "*.dylib" -exec cp -v {} out/ \; 2>/dev/null || true
          ls -laR out/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8Ball-deb
          path: out/
          if-no-files-found: warn
