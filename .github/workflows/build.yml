name: Build 8Ball Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip full source
        run: |
          set -x
          ls -la
          if [ -f 8Ball-2.zip ]; then
            rm -rf 8Ball
            unzip -o 8Ball-2.zip
            echo "=== extracted ==="
            ls -la 8Ball/
          fi

      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm curl unzip perl git libncurses6 || true

      - name: Setup Theos
        run: |
          set -x
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          cd "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git sdks || true
          ls -la "$THEOS"/sdks || true
          # toolchain for linux
          curl -L -o toolchain.tar.lzma "https://github.com/sbingner/llvm-project/releases/download/v16.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma" || \
          curl -L -o toolchain.tar.lzma "https://github.com/theos/theos/releases/download/toolchain/linux-ios-arm64e-clang-toolchain.tar.lzma" || true
          mkdir -p "$THEOS"/toolchain/linux/iphone
          if [ -f toolchain.tar.lzma ]; then
            tar --lzma -xvf toolchain.tar.lzma -C "$THEOS"/toolchain/linux/iphone --strip-components 1 || tar -xvf toolchain.tar.lzma -C "$THEOS"/toolchain/linux/iphone --strip-components 1 || true
          fi
          ls -la "$THEOS"/toolchain/linux/iphone 2>/dev/null || true

      - name: Build
        run: |
          set -x
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          cd 8Ball
          ls -la
          cat Makefile
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee /tmp/build.log || make package 2>&1 | tee -a /tmp/build.log || true
          cat /tmp/build.log | tail -80

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find 8Ball -name "*.deb" -exec cp {} out/ \; 2>/dev/null || true
          find 8Ball -name "*.dylib" -exec cp {} out/ \; 2>/dev/null || true
          find 8Ball -name "*.so" -exec cp {} out/ \; 2>/dev/null || true
          ls -laR out/ || true
          ls -la 8Ball/packages/ 2>/dev/null || true
          ls -la 8Ball/.theos/obj/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8Ball-deb
          path: out/
          if-no-files-found: warn
