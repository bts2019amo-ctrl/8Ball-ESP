name: Build 8Ball Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip full source
        run: |
          set -x
          ls -la
          if [ -f 8Ball-2.zip ]; then
            rm -rf 8Ball
            unzip -o 8Ball-2.zip
            echo "=== extracted ==="
            ls -la 8Ball/
          fi

      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libtinfo5 curl unzip perl git

      - name: Setup Theos
        run: |
          set -x
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          cd "$THEOS"
          # iOS SDK for Theos on Linux
          git clone --depth 1 https://github.com/theos/sdks.git sdks || true
          ls -la "$THEOS"/sdks || true
          # toolchain
          curl -LO https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma || true
          mkdir -p "$THEOS"/toolchain/linux/iphone
          tar --lzma -xvf linux-ios-arm64e-clang-toolchain.tar.lzma -C "$THEOS"/toolchain/linux/iphone --strip-components 1 2>/dev/null || true

      - name: Build
        run: |
          set -x
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          cd 8Ball
          ls -la
          cat Makefile
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless || make package || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find 8Ball -name "*.deb" -exec cp {} out/ \; 2>/dev/null || true
          find 8Ball -name "*.dylib" -exec cp {} out/ \; 2>/dev/null || true
          find 8Ball -name "*.so" -exec cp {} out/ \; 2>/dev/null || true
          ls -laR out/ || true
          ls -la 8Ball/packages/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8Ball-deb
          path: out/
          if-no-files-found: warn
